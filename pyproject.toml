[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reposhuffle"
version = "0.3.3"
description = "Reorganize Python implementations while preserving public imports and auxiliary trees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["libcst>=1.4,<2", "pathspec>=0.12,<2", "tomlkit>=0.13,<1", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9", "setuptools>=68", "wheel", "flit-core>=3.10", "hatchling>=1.26", "poetry-core>=2"]

[project.scripts]
reposhuffle = "reposhuffle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
